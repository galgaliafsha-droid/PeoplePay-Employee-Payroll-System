{% extends "base.html" %}{% block heading %}Attendance{% endblock %}{% block content %}
<div class="page-intro"><p class="muted">Record daily attendance and review monthly activity.</p></div>
<div class="panel"><div class="panel-head"><h3>Mark attendance</h3></div><form id="attendanceForm" class="form-grid"><label>Employee *<select name="employee_id" id="attendanceEmployee" required></select></label><label>Date *<input type="date" name="attendance_date" id="attendanceDate" required></label><label>Status *<select name="status"><option>Present</option><option>Absent</option><option>Half-day</option><option>Leave</option></select></label><label>Notes<input name="notes" placeholder="Optional notes"></label><div class="form-actions"><button class="primary">Save attendance</button></div></form></div>
<div class="panel"><div class="panel-head"><h3>Monthly attendance</h3><input type="month" id="attendanceMonth" class="search"></div><div class="table-wrap"><table><thead><tr><th>EMPLOYEE</th><th>DATE</th><th>STATUS</th><th>NOTES</th></tr></thead><tbody id="attendanceRows"></tbody></table></div></div>
{% endblock %}{% block scripts %}<script>initAttendance();</script>{% endblock %}
